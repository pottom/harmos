name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cgo: "0"
          - os: windows-latest
            cgo: "0"
          - os: macos-latest
            cgo: "1"
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Prove darwin cgo path
        if: runner.os == 'macOS'
        run: CGO_ENABLED=1 go build ./internal/clip/...

  oracle:
    # The differential check: an independent tool must open the cache we produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install keepassxc-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keepassxc
          keepassxc-cli --version
      - name: Oracle test
        run: go test -run TestKeepassXC ./internal/source/pleasant/ ./internal/vault/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Build golangci-lint v2 from source with the runner's Go, so its build
      # Go version always matches the module's target (a prebuilt binary lags
      # and refuses a newer target).
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run ./...
