name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cgo: "0"
          - os: windows-latest
            cgo: "0"
          - os: macos-latest
            cgo: "1"
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Prove darwin cgo path
        if: runner.os == 'macOS'
        run: CGO_ENABLED=1 go build ./internal/clip/...

  oracle:
    # The differential check: an independent tool must open the cache we produce.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # KeePassXC's own AppImage, not the distro package: apt drags in the whole
      # Qt/X11 desktop stack to run a console binary — eight minutes of install
      # for a five-second test, on every pull request.
      #
      # Pinned and checksummed on purpose. An oracle that moves under us cannot
      # tell "harmos broke something" from "the other tool changed", so bumping
      # the version is a deliberate commit, not something a mirror decides.
      - name: Install keepassxc-cli
        env:
          KPXC: "2.7.12"
          KPXC_SHA256: 564fe8b751b9ef7aa057e4d3d0b2878db24eaa0f6b1c855c82e699ab0913ae49
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o kpxc.AppImage \
            "https://github.com/keepassxreboot/keepassxc/releases/download/${KPXC}/KeePassXC-${KPXC}-x86_64.AppImage"
          echo "${KPXC_SHA256}  kpxc.AppImage" | sha256sum -c -
          chmod +x kpxc.AppImage
          ./kpxc.AppImage --appimage-extract >/dev/null   # extract: the runner has no FUSE
          sudo tee /usr/local/bin/keepassxc-cli >/dev/null <<EOF
          #!/bin/sh
          export LD_LIBRARY_PATH="$RUNNER_TEMP/squashfs-root/usr/lib:\${LD_LIBRARY_PATH:-}"
          exec "$RUNNER_TEMP/squashfs-root/usr/bin/keepassxc-cli" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/keepassxc-cli
          keepassxc-cli --version
      - name: Oracle test
        run: go test -run TestKeepassXC ./internal/source/pleasant/ ./internal/vault/

  # The vendored kdbx library is a separate module, so `go test ./...` at the
  # root never reaches it. Its tests are the only thing standing between a
  # mistake in the KDBX 4.1 patch and silent data loss in someone's vault.
  vendored-kdbx:
    name: vendored kdbx library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test
        run: go test ./...
        working-directory: third_party/gokeepasslib

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Build golangci-lint v2 from source with the runner's Go, so its build
      # Go version always matches the module's target (a prebuilt binary lags
      # and refuses a newer target).
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          "$(go env GOPATH)/bin/golangci-lint" run ./...
