version: 2

project_name: harmos

before:
  hooks:
    - go mod tidy

builds:
  # darwin needs cgo for the concealed-clipboard path (spec §4a); built on a
  # macOS runner.
  - id: darwin
    main: ./cmd/harmos
    binary: harmos
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags: &ldflags
      - -s -w
      - -X github.com/pottom/harmos/internal/version.Version={{ .Version }}
      - -X github.com/pottom/harmos/internal/version.GitCommit={{ .ShortCommit }}
      - -X github.com/pottom/harmos/internal/version.BuildDate={{ .Date }}
  # linux and windows stay pure Go and cross-compile.
  - id: nocgo
    main: ./cmd/harmos
    binary: harmos
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags: *ldflags

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "sha256sums.txt"
  algorithm: sha256

changelog:
  use: github
